<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="《栖居》DWELL · 双语字幕版。">
<title>栖居 DWELL</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{min-height:100svh;display:grid;place-items:center}
main{width:100%}
.stage{position:relative;width:100%;height:min(56.25vw,100svh);background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
video:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.start{position:absolute;inset:0;width:100%;display:grid;place-items:center;border:0;background:transparent;color:#fff;cursor:pointer}
.start span{width:64px;height:64px;display:grid;place-items:center;background:#000a;border:1px solid #ffffff90;border-radius:50%;font:26px -apple-system,BlinkMacSystemFont,sans-serif}
.start:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.start:disabled{cursor:wait}
.start[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>
</head>
<body>
<main>
<div class="stage">
<video id="film" controls playsinline preload="none" poster="poster.jpg" width="1920" height="1080" aria-label="播放《栖居》DWELL 双语字幕版">请使用支持 HTML5 视频的浏览器观看。</video>
<button id="start" class="start" type="button" aria-label="播放栖居"><span aria-hidden="true">▶</span></button>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
</div>
</main>
<script src="player.js" defer></script>
</body>
</html>
